# yaml-language-server: $schema=https://raw.githubusercontent.com/basetenlabs/truss/main/truss/config.schema.json

model_name: gemma4-31b-bf16-h100x2-vllm-20260806-apc

model_metadata:
  example_model_input:
    model: google/gemma-4-31B-it
    messages:
      - role: user
        content: "Call an available tool if the request requires it."
    stream: true
    stream_options:
      include_usage: true
    max_tokens: 128
    temperature: 1.0
    top_p: 0.95
    extra_body:
      top_k: 64
      chat_template_kwargs:
        enable_thinking: false
        preserve_thinking: false
  tags:
    - openai-compatible
    - gemma4
    - dense
    - benchmark
    - prefix-caching

# This immutable vLLM nightly is already validated with Gemma 4 streaming,
# tool parsing, reasoning parsing, and prefix caching in the 26B A4B BaseTen
# deployment. Gemma 4 31B is served without MTP for the initial campaign.
base_image:
  image: vllm/vllm-openai@sha256:24f2f8975d011ea7f7066a547886a08a1fd3c4bf0880463487fae4f01ce723c6

weights:
  - source: "hf://google/gemma-4-31B-it@842da3794eaa0b77d5f08bae87a17459d91ff475"
    mount_location: /models/gemma4-31b

resources:
  accelerator: H100:2
  use_gpu: true

runtime:
  predict_concurrency: 1
  streaming_read_timeout: 180
  health_checks:
    startup_threshold_seconds: 1800
    restart_threshold_seconds: 300
    stop_traffic_threshold_seconds: 120

environment_variables:
  VLLM_LOGGING_LEVEL: INFO

docker_server:
  start_command: >-
    vllm serve /models/gemma4-31b
    --served-model-name google/gemma-4-31B-it
    --host 0.0.0.0
    --port 8000
    --dtype bfloat16
    --tensor-parallel-size 2
    --max-model-len 32768
    --max-num-seqs 1
    --max-num-batched-tokens 8192
    --gpu-memory-utilization 0.90
    --generation-config vllm
    --enable-chunked-prefill
    --enable-prefix-caching
    --enable-prompt-tokens-details
    --limit-mm-per-prompt '{"image":0,"video":0,"audio":0}'
    --enable-auto-tool-choice
    --tool-call-parser gemma4
    --reasoning-parser gemma4
    --chat-template /models/gemma4-31b/chat_template.jinja
    --async-scheduling
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
