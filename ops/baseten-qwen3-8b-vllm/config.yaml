model_metadata:
  example_model_input:
    model: qwen/qwen3-8b
    messages:
      - role: user
        content: "Say hello in one sentence."
    stream: true
    max_tokens: 128
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    chat_template_kwargs:
      enable_thinking: false
  tags:
    - openai-compatible
    - qwen3
    - benchmark

model_name: qwen3-8b-bf16-vllm-benchmark

# Pin the vLLM 0.25.1 image digest already validated on BaseTen by the local
# Nemotron deployment so the 60-conversation cohort uses one immutable build.
base_image:
  image: vllm/vllm-openai@sha256:e4f88a835143cd22aee2397a26ec6bb80b3a4a6fe0c882bcbc63822904766089

docker_server:
  start_command: >-
    vllm serve /models/qwen3-8b
    --served-model-name qwen/qwen3-8b
    --host 0.0.0.0
    --port 8000
    --dtype bfloat16
    --tensor-parallel-size 1
    --max-model-len 32768
    --max-num-seqs 16
    --gpu-memory-utilization 0.90
    --generation-config vllm
    --enable-chunked-prefill
    --enable-prefix-caching
    --enable-auto-tool-choice
    --tool-call-parser hermes
    --reasoning-parser qwen3
    --default-chat-template-kwargs '{"enable_thinking": false}'
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000

# Pin the official BF16 checkpoint revision. BaseTen Delivery Network mirrors
# and mounts it without a runtime Hugging Face download.
weights:
  - source: "hf://Qwen/Qwen3-8B@b968826d9c46dd6066d109eabc6255188de91218"
    mount_location: /models/qwen3-8b

resources:
  accelerator: H100
  use_gpu: true

runtime:
  predict_concurrency: 16
  streaming_read_timeout: 120
  health_checks:
    startup_threshold_seconds: 1200
    restart_threshold_seconds: 300
    stop_traffic_threshold_seconds: 120
